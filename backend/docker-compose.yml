services:
  ollama:
    image: ollama/ollama:latest
    container_name: ntp-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "ollama pull llama3.2:1b"]
    restart: "no"

  backend:
    build: .
    container_name: ntp-backend
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    profiles: ["full"]

volumes:
  ollama:
