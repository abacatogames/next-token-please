services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: ntp-ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "sh", "-c", "OLLAMA_HOST=http://localhost:11434 ollama list"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    container_name: ntp-backend
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    profiles: ["full"]

volumes:
  ollama:
