services:
  frontend:
    build: ./frontend
    depends_on:
      - backend
    expose:
      - "80"
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
    restart: unless-stopped

  ollama:
    build:
      context: ./backend
      dockerfile: Dockerfile.ollama
    healthcheck:
      test: ["CMD", "sh", "-c", "OLLAMA_HOST=http://localhost:11434 ollama list"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  ollama:
