name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download NLTK data
        run: python scripts/bootstrap.py --skip-embeddings

      - name: Lint
        run: ruff check

      - name: Test
        run: pytest

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: ntp-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          build-args: |
            WITH_EMBEDDINGS=false

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          tags: ntp-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Create network
        run: docker network create ntp-ci

      - name: Start backend
        run: |
          docker run -d --name backend --network ntp-ci \
            -e PROMPT_GENERATION_ENABLED=false \
            -e ROUND_POOL_ENABLED=false \
            -e EMBEDDINGS_ENABLED=false \
            -e OLLAMA_URL=http://ollama-disabled:11434 \
            -p 8000:8000 \
            ntp-backend:ci

      - name: Smoke test backend
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health -o /tmp/health.json; then
              echo "Backend health response:"
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "::error title=Backend smoke test failed::/api/health did not respond 200 within 60s"
          docker logs backend || true
          exit 1

      - name: Start frontend
        run: |
          docker run -d --name frontend --network ntp-ci \
            -p 8080:80 \
            ntp-frontend:ci

      - name: Smoke test frontend
        run: |
          for _ in $(seq 1 15); do
            if curl -fsS http://localhost:8080/ -o /tmp/index.html \
              && grep -qi "<html" /tmp/index.html; then
              echo "Frontend served index.html"
              exit 0
            fi
            sleep 2
          done
          echo "::error title=Frontend smoke test failed::Static HTML not served on / within 30s"
          docker logs frontend || true
          exit 1

      - name: Container logs
        if: always()
        run: |
          echo "::group::backend logs"
          docker logs backend 2>&1 || true
          echo "::endgroup::"
          echo "::group::frontend logs"
          docker logs frontend 2>&1 || true
          echo "::endgroup::"
