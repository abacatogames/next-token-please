services:
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m

  backend:
    build: ./backend
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
      LOG_LEVEL: INFO
      EMBEDDINGS_ENABLED: "false"
    volumes:
      - backend_data:/srv/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    mem_limit: 2g

  ollama:
    build:
      context: ./backend
      dockerfile: Dockerfile.ollama
    environment:
      OLLAMA_MODEL: llama3.2:1b
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "sh", "-c", "OLLAMA_HOST=http://localhost:11434 ollama list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped
    mem_limit: 3g

volumes:
  ollama:
  backend_data:
